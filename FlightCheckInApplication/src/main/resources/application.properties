spring.application.name=FlightCheckInApplication

# Database (Cloud SQL for MySQL on GCP).
# In Kubernetes these come from the ConfigMap / Secret in gitops/.
# The defaults below are for a local MySQL only - never put real credentials here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/checkin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Reservation service (in Kubernetes: http://flight-reservation-service:8080/api/bookings)
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8080/api/bookings}

server.port=8081
frontend.url=${FRONTEND_URL}
