spring.application.name=FlightReservationApplication

# Database (Cloud SQL for MySQL on GCP).
# In Kubernetes these come from the ConfigMap / Secret in gitops/.
# The defaults below are for a local MySQL only - never put real credentials here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flightdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.auto-commit=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.address=0.0.0.0
frontend.url=${FRONTEND_URL}
