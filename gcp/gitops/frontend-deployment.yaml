apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-frontend
  namespace: flight-reservation
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: flight-frontend
  template:
    metadata:
      labels:
        app: flight-frontend
    spec:
      containers:
        - name: flight-frontend
          # Jenkins' "Update GitOps" stage rewrites this line to
          # <region>-docker.pkg.dev/<project-id>/<repo>/frontend:<BUILD_NUMBER>
          image: asia-south1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/flight-reservation-dev/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
