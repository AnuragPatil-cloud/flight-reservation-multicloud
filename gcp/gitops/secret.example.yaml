apiVersion: v1
kind: Secret
metadata:
  name: flight-reservation-secrets
  namespace: flight-reservation
type: Opaque
stringData:
  # Must match sql_username / sql_password in terraform/terraform.tfvars.
  # Copy this file to gitops/secret.yaml (gitignored), fill it in, and apply it by hand.
  DB_USERNAME: flightadmin
  DB_PASSWORD: CHANGE_ME_STRONG_PASSWORD
